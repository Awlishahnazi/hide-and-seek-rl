[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "hideseek"
version = "0.1.0"
description = "Lightweight 2D multi-agent hide-and-seek environment trained with MAPPO."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy==2.5.4",
    "torch==2.15.0",
    "pettingzoo==1.27.0",
    "gymnasium==1.4.0",
    "pygame==2.6.1",
    "pyyaml==6.0.3",
    "matplotlib==3.11.2",
    "pandas==3.1.1",
    "tensorboard==2.21.0",
    "imageio==2.38.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
