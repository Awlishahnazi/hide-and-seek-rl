<!DOCTYPE html>
<html>
<body>
    <h1>Replay Data Checker</h1>
    <pre id="output"></pre>
    <script>
        fetch('replay.json')
            .then(res => res.json())
            .then(data => {
                const output = document.getElementById('output');
                let text = "Total steps: " + data.steps.length + "\n\n";
                
                for (let i = 0; i < 5; i++) {
                    const s = data.steps[i];
                    if (s) {
                        text += `Step ${s.step}: Hiders = ${JSON.stringify(s.hiders)}, Seekers = ${JSON.stringify(s.seekers)}\n`;
                    }
                }
                
                text += "\n--- Phase Transition ---\n";
                for (let i = 40; i < 45; i++) {
                    const s = data.steps[i];
                    if (s) {
                        text += `Step ${s.step} (${s.is_prep_phase ? 'PREP' : 'CHASE'}): Hiders = ${JSON.stringify(s.hiders)}, Seekers = ${JSON.stringify(s.seekers)}\n`;
                    }
                }
                
                output.textContent = text;
            });
    </script>
</body>
</html>
